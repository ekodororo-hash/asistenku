<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Asisten Pribadi</title>
<style>
  :root { --bg:#f6f7fb; --outer:#e8eaf3; --card:#fff; --ink:#1d2433; --muted:#6b7385; --accent:#4f46e5; --line:#e4e7ef; --me:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --outer:#080a14; --card:#181c2e; --ink:#e8eaf3; --muted:#9aa1b5; --line:#2a3050; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--outer); color:var(--ink); height:100dvh; display:flex; justify-content:center; }
  #app { width:100%; height:100%; display:flex; flex-direction:column; background:var(--bg); min-height:0; }
  /* layar lebar: panel tetap penuh, isi chat dipersempit dan ditaruh di tengah */
  @media (min-width:761px) {
    #app #chat, #app .chips, #app #form {
      padding-left:max(16px, calc((100% - 720px) / 2));
      padding-right:max(16px, calc((100% - 720px) / 2));
    }
    #app .msg { max-width:80%; }
  }
  header { display:flex; align-items:center; gap:8px; padding:12px 16px; background:var(--card); border-bottom:2px solid var(--line); }
  body[data-mode="curhat"] header { border-bottom-color:var(--accent); }
  header h1 { font-size:17px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbtns { display:flex; gap:6px; align-items:center; flex:none; }
  a.btn { display:inline-flex; align-items:center; justify-content:center; font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; text-decoration:none; line-height:1.2; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; touch-action:manipulation; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #chatCol { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; line-height:1.45; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg .ts { font-size:11px; opacity:.65; text-align:right; margin-top:4px; line-height:1; }
  .msg.err { color:#d33; }
  .msg.note { align-self:center; background:transparent; border:1px dashed var(--line); color:var(--muted); font-size:13px; }
  .quota { margin:0 16px 8px; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.4; border:1px solid #e0a030; background:rgba(224,160,48,.15); color:var(--ink); }
  .quota[hidden] { display:none; }
  .chips { display:flex; gap:8px; padding:0 16px 8px; overflow-x:auto; }
  .chips button { white-space:nowrap; font-size:13px; padding:6px 10px; }
  #form { display:flex; gap:8px; padding:12px 16px; background:var(--card); border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); max-height:120px; }

  aside { order:-1; width:330px; background:var(--card); border-right:1px solid var(--line); padding:14px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  aside::-webkit-scrollbar { width:6px; }
  aside::-webkit-scrollbar-track { background:transparent; }
  aside::-webkit-scrollbar-thumb { background:var(--line); border-radius:10px; }
  aside::-webkit-scrollbar-thumb:hover { background:var(--muted); }
  aside h2 { font-size:15px; margin:0 0 10px; }
  .tabs { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px; margin-bottom:14px; }
  .tabs button { min-width:0; padding:8px 1px; font-size:11px; line-height:1.2; border-radius:12px; white-space:nowrap; }
  @media (max-width:380px) { .tabs { gap:5px; } .tabs button { font-size:10.5px; } }
  @media (max-width:340px) { .tabs { gap:4px; } .tabs button { font-size:9.5px; } }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pane { display:none; }
  .pane.on { display:block; }
  .addrow { display:flex; gap:6px; margin-bottom:8px; }
  .addrow input, .addrow select, .full { flex:1; min-width:0; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  .full { width:100%; margin-bottom:8px; }
  .muted { color:var(--muted); font-size:14px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px; font-size:14px; line-height:1.5; white-space:pre-line; }
  .task { display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .task span { flex:1; font-size:14px; word-break:break-word; }
  .task.done span { text-decoration:line-through; color:var(--muted); }
  .task button { padding:2px 8px; font-size:12px; }
  .card.wx { white-space:normal; }
  .wx-top { display:flex; align-items:center; gap:12px; }
  .wx-ico { font-size:44px; line-height:1; }
  .wx-temp { font-size:30px; font-weight:600; line-height:1.1; }
  .wx-place { font-size:13px; color:var(--muted); }
  .wx-meta { margin-top:8px; color:var(--muted); font-size:13px; line-height:1.5; }
  .hours { display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .hours::-webkit-scrollbar { height:6px; }
  .hours::-webkit-scrollbar-track { background:transparent; }
  .hours::-webkit-scrollbar-thumb { background:var(--line); border-radius:10px; }
  .hours div { flex:0 0 auto; text-align:center; font-size:12px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; min-width:52px; }
  .hours b { display:block; font-size:16px; font-weight:400; margin:2px 0; }
  .cats { display:flex; gap:8px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .cats::-webkit-scrollbar { height:6px; }
  .cats::-webkit-scrollbar-track { background:transparent; }
  .cats::-webkit-scrollbar-thumb { background:var(--line); border-radius:10px; }
  .cats button { white-space:nowrap; font-size:13px; padding:6px 12px; flex:none; }
  .cats button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .news a { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; }
  .news img { width:88px; height:64px; object-fit:cover; border-radius:8px; flex:none; background:var(--line); }
  .news .t { font-size:14px; line-height:1.35; }
  .news .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .side-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .side-head h2 { margin:0; }
  #closeSide { font-size:14px; padding:6px 14px; }
  #tasksToggle, #closeSide, #backdrop { display:none; }

  #app { visibility:hidden; }
  body.ready #app { visibility:visible; }
  #pinGate { position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  #pinGate.hide { display:none; }
  #pinGate .box { width:min(320px,90vw); text-align:center; }
  #pinGate input { width:100%; text-align:center; font-size:22px; letter-spacing:6px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); margin:14px 0; }
  #pinGate p.err { color:#d33; font-size:13px; min-height:18px; margin:0 0 4px; }

  dialog { border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--ink); width:min(92vw,420px); }
  dialog label { display:block; margin:10px 0 4px; font-size:13px; color:var(--muted); }
  dialog input, dialog textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--bg); color:var(--ink); font:inherit; }

  @media (max-width:760px) {
    header { padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); gap:6px; }
    header h1 { font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    header button, header a.btn { padding:8px 10px; font-size:13px; min-height:40px; }
    header .lbl { display:none; }
    #chat { padding:12px; gap:8px; }
    .msg { max-width:92%; font-size:15px; }
    .chips { padding:0 12px 8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chips button { min-height:36px; }
    #form { padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
    textarea, input, select, .addrow input, .addrow select, .full, dialog input, dialog textarea { font-size:16px; } /* cegah zoom otomatis di iOS */
    #sendBtn { min-height:44px; padding:0 16px; }
    aside { position:fixed; top:0; left:0; bottom:0; width:min(90vw,360px); padding-top:max(14px, env(safe-area-inset-top)); transform:translateX(-100%); transition:transform .22s ease, box-shadow .22s ease; z-index:20; box-shadow:none; }
    aside.open { transform:none; box-shadow:8px 0 24px #0004; }
    #tasksToggle, #closeSide { display:inline-block; }
    #backdrop { position:fixed; inset:0; background:#0006; z-index:15; }
    #backdrop.show { display:block; }
    .tabs button { min-height:38px; }
    .addrow button { min-width:44px; min-height:40px; }
    .task { padding:12px 0; }
    .task input[type=checkbox] { width:20px; height:20px; }
    .task button { min-width:36px; min-height:36px; }
    dialog { width:92vw; max-height:90dvh; overflow-y:auto; }
  }
</style>
</head>
<body data-mode="asisten">
<div id="pinGate" class="hide">
  <div class="box">
    <h2 style="margin:0 0 6px" id="authTitle">🔒 Masuk</h2>
    <p class="muted" style="margin:0 0 4px" id="authSub">Masuk ke asistenmu.</p>
    <form id="authForm">
      <input id="authUser" type="text" autocomplete="username" autocapitalize="none" placeholder="Username" style="font-size:16px;letter-spacing:0;margin:14px 0 0">
      <input id="authPass" type="password" autocomplete="current-password" placeholder="Password" style="font-size:16px;letter-spacing:0;margin:8px 0 0">
      <input id="authInvite" type="password" autocomplete="off" placeholder="Kode undangan" style="font-size:16px;letter-spacing:0;margin:8px 0 0">
      <p class="err" id="pinErr" style="margin-top:10px"></p>
      <button class="primary" type="submit" id="authBtn" style="width:100%">Masuk</button>
    </form>
    <p class="muted" style="margin:14px 0 0;font-size:13px"><a href="#" id="authSwitch">Belum punya akun? Daftar</a></p>
  </div>
</div>
<div id="app">
<header>
  <button id="tasksToggle" title="Panel">☰ Panel</button>
  <h1 id="title">Asisten Pribadi</h1>
  <div class="hbtns">
    <button id="modeBtn" title="Ganti mode">Curhat</button>
    <button id="clearBtn" title="Mulai obrolan baru">Chat baru</button>
    <a href="/settings.html" class="btn" title="Pengaturan" aria-label="Pengaturan">⚙️<span class="lbl">&nbsp;Pengaturan</span></a>
  </div>
</header>

<main>
  <section id="chatCol">
    <div id="chat"></div>
    <div id="quotaBar" class="quota" hidden></div>
    <div class="chips">
      <button data-q="Bantu aku susun rencana hari ini berdasarkan daftar tugasku.">Rencana hari ini</button>
      <button data-q="Tugas mana yang sebaiknya kukerjakan dulu? Urutkan berdasarkan prioritas.">Prioritas tugas</button>
      <button data-q="Ringkas pengeluaranku bulan ini dan beri saran hemat yang realistis.">Rekap uang</button>
      <button data-q="Bantu tulis pesan WhatsApp yang sopan untuk ">Tulis pesan</button>
      <button data-q="Beri aku 3 ide makan malam hemat dan cepat.">Ide makan malam</button>
    </div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Tulis pesan..."></textarea>
      <button class="primary" id="sendBtn">Kirim</button>
    </form>
  </section>

  <div id="backdrop"></div>
  <aside id="side">
    <div class="side-head">
      <h2>Panel</h2>
      <button id="closeSide">Tutup</button>
    </div>

    <div class="tabs">
      <button data-tab="tasks">Tugas</button>
      <button data-tab="remind">Pengingat</button>
      <button data-tab="notes">Catatan</button>
      <button data-tab="money">Uang</button>
      <button data-tab="info">Info</button>
    </div>

    <div class="pane" id="pane-tasks">
      <div class="addrow">
        <input id="taskInput" placeholder="Tambah tugas...">
        <button id="taskAddBtn">+</button>
      </div>
      <div class="addrow">
        <input id="taskWhen" type="datetime-local" title="Jam pengingat (opsional, WIB)" aria-label="Jam pengingat (opsional, WIB)">
      </div>
      <p class="muted" style="margin:-2px 0 8px">Isi jam (WIB) kalau tugas mau diingatkan lewat Telegram. Kosongkan kalau tidak.</p>
      <div id="tasks"></div>
    </div>

    <div class="pane" id="pane-remind">
      <div class="addrow">
        <input id="remText" placeholder="Ingatkan aku untuk...">
      </div>
      <div class="addrow">
        <input id="remWhen" type="datetime-local">
        <select id="remRepeat">
          <option value="">Sekali</option><option value="harian">Tiap hari</option>
          <option value="mingguan">Tiap minggu</option><option value="bulanan">Tiap bulan</option>
        </select>
        <button id="remAddBtn">+</button>
      </div>
      <p class="muted" id="remNote"></p>
      <div id="reminders"></div>
    </div>

    <div class="pane" id="pane-notes">
      <div class="addrow">
        <input id="noteInput" placeholder="Tulis catatan...">
        <button id="noteAddBtn">+</button>
      </div>
      <input class="full" id="noteSearch" placeholder="Cari catatan...">
      <div id="notes"></div>
    </div>

    <div class="pane" id="pane-money">
      <div class="addrow">
        <input id="expAmt" type="number" inputmode="numeric" min="0" placeholder="Jumlah (Rp)">
        <select id="expCat">
          <option>makan</option><option>transport</option><option>belanja</option>
          <option>tagihan</option><option>hiburan</option><option>kesehatan</option><option>lainnya</option>
        </select>
      </div>
      <div class="addrow">
        <input id="expNote" placeholder="Keterangan">
        <button id="expAddBtn">+</button>
      </div>
      <div class="card" id="recap"></div>
      <div id="exps"></div>
    </div>

    <div class="pane" id="pane-info">
      <div class="addrow">
        <input id="cityInput" placeholder="Kota">
        <button id="cityBtn">Cuaca</button>
      </div>
      <div class="card" id="weather">Belum dimuat.</div>
      <div class="cats" id="cats"></div>
      <div class="addrow">
        <input id="topicInput" placeholder="Cari topik berita...">
        <button id="newsBtn">Cari</button>
      </div>
      <div class="news" id="news"></div>
    </div>
  </aside>
</main>
</div>


<script src="/pw.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const rupiah = (n) => "Rp" + Math.round(n).toLocaleString("id-ID");
const fmtDate = (ts) => new Date(ts).toLocaleDateString("id-ID", { day: "numeric", month: "short" });

/* ---------- PIN & API (data tersinkron dengan Telegram, disimpan di server) ---------- */
let wasLoggedIn = false;
async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, { headers, credentials: "same-origin" }));
  if (r.status === 401) {
    showGate(wasLoggedIn ? "Sesi habis. Silakan masuk lagi." : "");
    throw new Error("Belum login");
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Gagal memuat");
  return d;
}

window.authPwBox = PW.attach($("authPass"), { examples: true });
window.authPwBox.style.display = "none"; // bar kekuatan hanya saat Daftar
PW.eye($("authInvite"));
$("authInvite").parentElement.style.display = "none"; // tampil hanya saat Daftar
let registerMode = false;
function setAuthMode(reg) {
  registerMode = reg;
  $("authTitle").textContent = reg ? "✨ Daftar" : "🔒 Masuk";
  $("authSub").textContent = reg ? "Buat akun baru (perlu kode undangan)." : "Masuk ke asistenmu.";
  $("authInvite").parentElement.style.display = reg ? "" : "none";
  if (window.authPwBox) window.authPwBox.style.display = reg ? "" : "none";
  $("authPass").autocomplete = reg ? "new-password" : "current-password";
  $("authBtn").textContent = reg ? "Daftar" : "Masuk";
  $("authSwitch").textContent = reg ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
  $("pinErr").textContent = "";
}
function showGate(err) {
  $("pinGate").classList.remove("hide");
  $("pinErr").textContent = err || "";
  $("authPass").value = "";
  $("authInvite").value = "";
  $("authUser").focus();
}
function hideGate() { $("pinGate").classList.add("hide"); document.body.classList.add("ready"); }

/* ---------- State (dimuat dari server, bukan localStorage lagi) ---------- */
let messages = [];
let tasks = [];
let notes = [];
let expenses = [];
let reminders = [];
let botLinked = true;
let profile = { name: "", assistantName: "Asisten", notes: "" };
let mode = "asisten";
let busy = false;
let infoLoaded = false;

// Preferensi lokal per-perangkat (bukan data pribadi, tetap di localStorage)
let city = load("city", "Jakarta");

/* ---------- Chat ---------- */
function renderTitle() { $("title").textContent = profile.assistantName || "Asisten Pribadi"; }

function fmtClock(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false }).replace(":", ".");
  if (d.toDateString() === now.toDateString()) return time;
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short" }) + " " + time;
}

function setBubble(d, text, ts) {
  d.textContent = "";
  const t = document.createElement("div");
  t.textContent = text;
  d.appendChild(t);
  if (ts) {
    const s = document.createElement("div");
    s.className = "ts";
    s.textContent = fmtClock(ts);
    d.appendChild(s);
  }
}

function addBubble(role, text, cls, ts) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot") + (cls ? " " + cls : "");
  setBubble(d, text, ts);
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

function renderChat() {
  $("chat").innerHTML = "";
  if (!messages.length) {
    addBubble("bot", "Halo! Aku asistan pribadimu. Aku bisa bantu atur rencana, catat tugas dan catatan, mencatat pengeluaran, tulis pesan, atau jadi teman cerita.\n\nObrolan, tugas, catatan, dan uang di sini sama persis dengan bot Telegram-mu.\n\nCoba: \"makan siang 25rb\", \"catat: ide konten minggu depan\", atau \"tambah tugas bayar listrik besok\".");
  }
  messages.forEach((m) => addBubble(m.role, m.text, "", m.ts));
}

function renderMode() {
  document.body.dataset.mode = mode;
  $("modeBtn").textContent = mode === "curhat" ? "Asisten" : "Curhat";
}

/* ---------- Tugas ---------- */
function renderTasks() {
  const box = $("tasks");
  box.innerHTML = "";
  if (!tasks.length) { box.innerHTML = '<p class="muted">Belum ada tugas.</p>'; return; }
  tasks.forEach((t) => {
    const row = document.createElement("div");
    row.className = "task" + (t.done ? " done" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = async () => {
      try { await api("/api/state", { method: "POST", body: JSON.stringify({ op: "toggleTask", id: t.id }) }); t.done = cb.checked; renderTasks(); refreshFromServer(); }
      catch (e) { cb.checked = !cb.checked; alert(e.message); }
    };
    const sp = document.createElement("span"); sp.textContent = t.text;
    if (t.due) {
      const w = document.createElement("small");
      w.className = "muted";
      w.style.display = "block";
      w.textContent = "⏰ " + new Date(t.due).toLocaleString("id-ID", { timeZone: "Asia/Jakarta", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + " WIB";
      sp.appendChild(w);
    }
    const del = document.createElement("button"); del.textContent = "x";
    del.onclick = async () => {
      try { await api("/api/state", { method: "POST", body: JSON.stringify({ op: "deleteTask", id: t.id }) }); tasks = tasks.filter((x) => x.id !== t.id); renderTasks(); }
      catch (e) { alert(e.message); }
    };
    row.append(cb, sp, del);
    box.appendChild(row);
  });
}

async function addTask(text, when) {
  text = String(text).trim();
  if (!text) return;
  const ts = when ? Date.parse(when + ":00+07:00") : null; // isi jam dianggap WIB
  if (when && (!Number.isFinite(ts) || ts <= Date.now())) { alert("Jam pengingat sudah lewat atau tidak valid."); return; }
  try {
    const { result } = await api("/api/state", { method: "POST", body: JSON.stringify({ op: "addTask", text, ts }) });
    if (result) { tasks.push(result); renderTasks(); }
  } catch (e) { alert(e.message); }
}

/* ---------- Pengingat (dikirim lewat Telegram oleh server) ---------- */
const REPEAT_LABEL = { harian: "tiap hari", mingguan: "tiap minggu", bulanan: "tiap bulan" };
const fmtWhen = (ts) => new Date(ts).toLocaleString("id-ID", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }).replace(":", ".");

function renderReminders() {
  $("remNote").textContent = botLinked ? "" : "Bot Telegram belum terhubung, jadi pengingat belum bisa terkirim. Hubungkan dulu di Pengaturan.";
  const box = $("reminders");
  box.innerHTML = "";
  if (!reminders.length) { box.innerHTML = '<p class="muted">Belum ada pengingat.</p>'; return; }
  reminders.forEach((r) => {
    box.appendChild(makeRow(
      r.text + (r.repeat ? " (" + REPEAT_LABEL[r.repeat] + ")" : ""),
      fmtWhen(r.ts),
      async () => {
        try { await api("/api/state", { method: "POST", body: JSON.stringify({ op: "deleteReminder", id: r.id }) }); reminders = reminders.filter((x) => x.id !== r.id); renderReminders(); }
        catch (e) { alert(e.message); }
      }
    ));
  });
}

async function doAddRem() {
  const text = $("remText").value.trim();
  const when = $("remWhen").value;
  if (!text) { alert("Isi dulu pengingatnya."); return; }
  if (!when) { alert("Pilih tanggal dan jam."); return; }
  const ts = new Date(when).getTime();
  if (!(ts > Date.now())) { alert("Waktunya sudah lewat."); return; }
  try {
    const { result } = await api("/api/state", { method: "POST", body: JSON.stringify({ op: "addReminder", text, ts, repeat: $("remRepeat").value || null }) });
    if (result) {
      reminders.push(result);
      reminders.sort((a, b) => a.ts - b.ts);
      renderReminders();
      $("remText").value = ""; $("remWhen").value = ""; $("remRepeat").value = "";
    }
  } catch (e) { alert(e.message); }
}

/* ---------- Baris umum (catatan, pengeluaran) ---------- */
function makeRow(text, sub, onDel) {
  const row = document.createElement("div");
  row.className = "task";
  const sp = document.createElement("span");
  sp.textContent = text;
  if (sub) {
    const s = document.createElement("small");
    s.textContent = sub;
    s.style.cssText = "display:block;color:var(--muted)";
    sp.appendChild(s);
  }
  const del = document.createElement("button");
  del.textContent = "x";
  del.onclick = onDel;
  row.append(sp, del);
  return row;
}

/* ---------- Catatan ---------- */
async function addNote(text) {
  text = String(text).trim();
  if (!text) return;
  try {
    const { result } = await api("/api/state", { method: "POST", body: JSON.stringify({ op: "addNote", text }) });
    if (result) { notes.unshift(result); renderNotes(); }
  } catch (e) { alert(e.message); }
}

function renderNotes() {
  const q = $("noteSearch").value.trim().toLowerCase();
  const box = $("notes");
  box.innerHTML = "";
  const list = notes.filter((n) => !q || n.text.toLowerCase().includes(q));
  if (!list.length) { box.innerHTML = '<p class="muted">' + (q ? "Tidak ada yang cocok." : "Belum ada catatan.") + "</p>"; return; }
  list.forEach((n) => {
    box.appendChild(makeRow(n.text, fmtDate(n.ts), async () => {
      try { await api("/api/state", { method: "POST", body: JSON.stringify({ op: "deleteNote", id: n.id }) }); notes = notes.filter((x) => x.id !== n.id); renderNotes(); }
      catch (e) { alert(e.message); }
    }));
  });
}

/* ---------- Pengeluaran ---------- */
function renderMoney() {
  const total = expenses.reduce((s, e) => s + e.amt, 0);
  const by = {};
  expenses.forEach((e) => { by[e.cat] = (by[e.cat] || 0) + e.amt; });
  const lines = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([c, v]) => c + ": " + rupiah(v));
  $("recap").textContent = expenses.length
    ? "Bulan ini: " + rupiah(total) + " (" + expenses.length + " transaksi)\n" + lines.join("\n")
    : "Belum ada pengeluaran bulan ini.";
  const box = $("exps");
  box.innerHTML = "";
  expenses.slice(0, 15).forEach((e) => {
    box.appendChild(makeRow(
      (e.note || e.cat) + " - " + rupiah(e.amt),
      fmtDate(e.ts) + " · " + e.cat,
      async () => {
        try { await api("/api/state", { method: "POST", body: JSON.stringify({ op: "deleteExpense", id: e.id }) }); expenses = expenses.filter((x) => x.id !== e.id); renderMoney(); }
        catch (err) { alert(err.message); }
      }
    ));
  });
}

/* ---------- Info: cuaca & berita (lokal, tidak terkait sinkronisasi) ---------- */
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

async function loadWeather() {
  const box = $("weather");
  box.className = "card";
  box.textContent = "Memuat cuaca...";
  try {
    const r = await fetch("/api/info?type=weather&city=" + encodeURIComponent(city));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Gagal");
    box.className = "card wx";
    box.textContent = "";
    const top = el("div", "wx-top");
    top.appendChild(el("div", "wx-ico", d.icon));
    const mid = el("div");
    mid.appendChild(el("div", "wx-temp", d.temp + "°C"));
    mid.appendChild(el("div", "wx-place", d.city + (d.country ? ", " + d.country : "") + " · " + d.desc));
    top.appendChild(mid);
    box.appendChild(top);
    box.appendChild(el("div", "wx-meta",
      "Terasa " + d.feels + "°C · Hari ini " + d.min + "-" + d.max + "°C · Peluang hujan " + d.rain + "%"));
    const hours = el("div", "hours");
    (d.hours || []).forEach((h) => {
      const c = el("div");
      c.appendChild(el("span", "", h.time));
      c.appendChild(el("b", "", h.icon));
      c.appendChild(el("span", "", h.temp + "°"));
      hours.appendChild(c);
    });
    box.appendChild(hours);
  } catch (e) {
    box.className = "card";
    box.textContent = "Gagal memuat cuaca: " + e.message;
  }
}

function ago(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "baru saja";
  if (m < 60) return m + " menit lalu";
  const h = Math.round(m / 60);
  if (h < 24) return h + " jam lalu";
  return Math.round(h / 24) + " hari lalu";
}

const CATS = [["terkini", "Terkini"], ["nasional", "Nasional"], ["detik", "detikNews"], ["ekonomi", "Ekonomi"], ["teknologi", "Teknologi"], ["olahraga", "Olahraga"]];
let cat = load("cat", "terkini");
if (!CATS.some((c) => c[0] === cat)) cat = "terkini";

function renderCats(active) {
  const box = $("cats");
  box.innerHTML = "";
  CATS.forEach(([key, label]) => {
    const b = el("button", key === active ? "on" : "", label);
    b.onclick = () => {
      cat = key; save("cat", cat);
      $("topicInput").value = "";
      renderCats(cat);
      loadNews("");
    };
    box.appendChild(b);
  });
}

async function loadNews(topic) {
  const box = $("news");
  box.innerHTML = "";
  box.appendChild(el("p", "muted", "Memuat berita..."));
  try {
    const r = await fetch("/api/info?type=news&cat=" + encodeURIComponent(cat) + "&topic=" + encodeURIComponent(topic || ""));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Gagal");
    box.innerHTML = "";
    if (!d.items.length) { box.appendChild(el("p", "muted", "Tidak ada berita ditemukan.")); return; }
    d.items.forEach((it) => {
      const a = document.createElement("a");
      if (/^https:\/\//.test(it.link)) { a.href = it.link; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      if (it.img && /^https:\/\//.test(it.img)) {
        const img = document.createElement("img");
        img.src = it.img; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
        img.onerror = () => img.remove();
        a.appendChild(img);
      }
      const body = el("div");
      body.appendChild(el("div", "t", it.title));
      const meta = [it.source, ago(it.date)].filter(Boolean).join(" · ");
      if (meta) body.appendChild(el("div", "meta", meta));
      a.appendChild(body);
      box.appendChild(a);
    });
  } catch (e) {
    box.innerHTML = "";
    box.appendChild(el("p", "muted", "Gagal memuat berita: " + e.message));
  }
}

function loadInfo() {
  infoLoaded = true;
  $("cityInput").value = city;
  loadWeather();
  const topic = $("topicInput").value.trim();
  renderCats(topic ? "" : cat);
  loadNews(topic);
}

/* ---------- Tab panel ---------- */
function showTab(t) {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.id === "pane-" + t));
  save("tab", t);
  if (t === "info" && !infoLoaded) loadInfo();
}

function toggleSide(open) {
  $("side").classList.toggle("open", open);
  $("backdrop").classList.toggle("show", open);
}

/* ---------- Peringatan kuota ---------- */
function resetWib() { // tengah malam waktu Pasifik berikutnya, ditampilkan dalam WIB
  const now = new Date();
  const pac = new Date(now.toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
  const next = new Date(pac); next.setHours(24, 0, 0, 0);
  return new Date(now.getTime() + (next - pac)).toLocaleTimeString("id-ID", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit" });
}
function showQuota(q) {
  const bar = $("quotaBar");
  if (!q || !q.total || q.left > Math.max(3, Math.ceil(q.total * 0.2))) { bar.hidden = true; return; }
  bar.textContent = (q.left === 0
    ? "Kuota gratis hari ini kemungkinan habis (" + q.used + " dari ±" + q.total + " permintaan). "
    : "Sisa kuota gratis hari ini kira-kira " + q.left + " dari ±" + q.total + " permintaan. ") +
    "Reset sekitar pukul " + resetWib() + " WIB.";
  bar.hidden = false;
}

/* ---------- Kirim pesan ---------- */
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; $("sendBtn").disabled = true;
  const sentAt = Date.now();
  messages.push({ role: "user", text, ts: sentAt });
  addBubble("user", text, "", sentAt);
  $("input").value = "";
  autoGrow();
  const wait = addBubble("bot", "...");
  try {
    const d = await api("/api/chat", { method: "POST", body: JSON.stringify({ text }) });
    const shown = [d.reply, ...(d.added || [])].filter(Boolean).join("\n\n") || "(tidak ada jawaban)";
    const gotAt = Date.now();
    setBubble(wait, shown, gotAt);
    messages.push({ role: "model", text: d.reply || "(dicatat)", ts: gotAt });
    if (d.tasks) { tasks = d.tasks; renderTasks(); }
    if (d.notes) { notes = d.notes; renderNotes(); }
    if (d.expenses) { expenses = d.expenses; renderMoney(); }
    if (d.reminders) { reminders = d.reminders; renderReminders(); }
    showQuota(d.quota);
  } catch (e) {
    setBubble(wait, "Error: " + e.message);
    wait.classList.add("err");
    messages.pop();
  } finally {
    busy = false; $("sendBtn").disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
  }
}

/* ---------- Event ---------- */
$("form").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); }
});
document.querySelectorAll(".chips button").forEach((b) => {
  b.onclick = () => {
    const q = b.dataset.q;
    if (q.endsWith(" ")) { $("input").value = q; $("input").focus(); } else send(q);
  };
});

document.querySelectorAll(".tabs button").forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });

const onEnter = (id, fn) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); fn(); } });

const doAddTask = () => { addTask($("taskInput").value, $("taskWhen").value); $("taskInput").value = ""; $("taskWhen").value = ""; };
$("taskAddBtn").onclick = doAddTask; onEnter("taskInput", doAddTask);

$("remAddBtn").onclick = doAddRem; onEnter("remText", doAddRem);

const doAddNote = () => { addNote($("noteInput").value); $("noteInput").value = ""; };
$("noteAddBtn").onclick = doAddNote; onEnter("noteInput", doAddNote);
$("noteSearch").addEventListener("input", renderNotes);

const doAddExp = async () => {
  const amt = Number($("expAmt").value);
  if (!Number.isFinite(amt) || amt <= 0) { alert("Jumlah tidak valid"); return; }
  try {
    const { result } = await api("/api/state", { method: "POST", body: JSON.stringify({ op: "addExpense", amt, cat: $("expCat").value, note: $("expNote").value }) });
    if (result) { expenses.unshift(result); renderMoney(); $("expAmt").value = ""; $("expNote").value = ""; }
  } catch (e) { alert(e.message); }
};
$("expAddBtn").onclick = doAddExp; onEnter("expNote", doAddExp);

const doCity = () => {
  const c = $("cityInput").value.trim();
  if (!c) return;
  city = c; save("city", city); loadWeather();
};
$("cityBtn").onclick = doCity; onEnter("cityInput", doCity);

const doNews = () => {
  const topic = $("topicInput").value.trim();
  renderCats(topic ? "" : cat);
  loadNews(topic);
};
$("newsBtn").onclick = doNews; onEnter("topicInput", doNews);

$("tasksToggle").onclick = () => toggleSide(!$("side").classList.contains("open"));
$("closeSide").onclick = () => toggleSide(false);
$("backdrop").onclick = () => toggleSide(false);

$("modeBtn").onclick = async () => {
  const next = mode === "curhat" ? "asisten" : "curhat";
  try {
    await api("/api/state", { method: "POST", body: JSON.stringify({ op: "setMode", mode: next }) });
    mode = next;
    renderMode();
    addBubble("bot", mode === "curhat" ? "Mode curhat aktif. Cerita aja, aku dengerin." : "Kembali ke mode asisten.", "note");
  } catch (e) { alert(e.message); }
};

// kolom ketik otomatis membesar
function autoGrow() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 120) + "px";
}
$("input").addEventListener("input", autoGrow);

// tetap di bagian bawah saat keyboard HP muncul
if (window.visualViewport) {
  visualViewport.addEventListener("resize", () => {
    document.body.style.height = visualViewport.height + "px";
    $("chat").scrollTop = $("chat").scrollHeight;
  });
}

$("clearBtn").onclick = async () => {
  if (!confirm("Mulai obrolan baru? Riwayat obrolan dihapus (di bot Telegram juga, karena datanya sama). Tugas, catatan, uang, dan pengingat tetap aman.")) return;
  try {
    await api("/api/state", { method: "POST", body: JSON.stringify({ op: "resetHist" }) });
    messages = []; renderChat();
  } catch (e) { alert(e.message); }
};

/* ---------- Boot: cek PIN lalu muat semua data dari server ---------- */
async function loadState() {
  const d = await api("/api/state");
  tasks = d.tasks || [];
  notes = d.notes || [];
  expenses = d.expenses || [];
  profile = d.profile || profile;
  mode = d.mode || "asisten";
  messages = d.messages || [];
  reminders = d.reminders || [];
  botLinked = d.botLinked !== false;
}

// Segarkan berkala supaya obrolan dari Telegram (dan perubahan lain) muncul tanpa muat ulang halaman
const sig = (a) => a.length + ":" + (a.length ? a[a.length - 1].ts : 0);
async function refreshFromServer() {
  if (busy || document.hidden || $("pinGate") && !$("pinGate").classList.contains("hide")) return;
  try {
    const d = await api("/api/state?light=1");
    if (busy) return; // pesan sedang dikirim, jangan timpa
    const before = sig(messages), oldMode = mode;
    tasks = d.tasks || []; notes = d.notes || []; expenses = d.expenses || [];
    reminders = d.reminders || []; botLinked = d.botLinked !== false;
    mode = d.mode || "asisten"; messages = d.messages || [];
    if (sig(messages) !== before) renderChat();
    if (mode !== oldMode) renderMode();
    renderTasks(); renderNotes(); renderMoney(); renderReminders();
  } catch {}
}
setInterval(refreshFromServer, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshFromServer(); });
window.addEventListener("focus", refreshFromServer);

async function boot() {
  try {
    await loadState();
    wasLoggedIn = true;
    hideGate();
    renderTitle(); renderMode(); renderChat();
    renderTasks(); renderNotes(); renderMoney(); renderReminders();
    showTab(load("tab", "tasks"));
  } catch (e) {
    if (e.message !== "Belum login") showGate("Gagal memuat: " + e.message);
  }
}

$("authSwitch").addEventListener("click", (e) => { e.preventDefault(); setAuthMode(!registerMode); });

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("pinErr").textContent = "Memproses...";
  const body = { op: registerMode ? "register" : "login", username: $("authUser").value, password: $("authPass").value };
  if (registerMode) body.invite = $("authInvite").value;
  try {
    const r = await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("pinErr").textContent = d.error || "Gagal"; return; }
    $("pinErr").textContent = "";
    boot();
  } catch (err) { $("pinErr").textContent = "Gagal terhubung: " + err.message; }
});


boot();
</script>
